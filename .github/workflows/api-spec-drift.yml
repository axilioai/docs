name: API Spec Drift

# Opens a per-version "review the reference docs" PR when the backend ships a
# new *production* API version.
#
# How it fires: the backend's production deploy pipeline, on a successful
# deploy, syncs the freshly generated OpenAPI spec into axilioai/platform-python
# and — only when the spec's info.version actually changed — fires a
# docs-spec-updated repository_dispatch at this repo. The dispatch carries the
# previous + new backend version and the list of backend PRs that landed
# between them.
#
# Why version-keyed: a CI gate makes every public-spec change bump
# info.version, description-only edits included, so each production version
# that changed the spec gets exactly one PR, on its own branch, keeping each
# release's docs review self-contained.
#
# What the PR carries: docs.json renders the REST endpoint pages from the
# committed api-reference/openapi-backend.json, so the PR regenerates that file
# from the production spec (scripts/sync-openapi.py) and fails if production
# isn't serving the version that was just deployed. The guide pages are
# hand-written prose, so the PR also points the author at the backend PRs that
# drove the change. The guarantee is "a new API version can't ship without a
# docs PR landing in the queue."

on:
  repository_dispatch:
    types: [docs-spec-updated]

permissions:
  contents: write
  pull-requests: write

jobs:
  open-drift-pr:
    name: Open per-version docs PR
    # Production only — staging carries unreleased surface that must never
    # reach the public docs.
    if: github.event.client_payload.environment == 'production'
    runs-on: ubuntu-latest
    env:
      NEW_VERSION: ${{ github.event.client_payload.backend_version }}
      PREV_VERSION: ${{ github.event.client_payload.prev_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the backend API reference
        # Fail rather than commit a spec from another version, e.g. a cached
        # response or a deploy that hasn't finished rolling out.
        run: |
          python3 scripts/sync-openapi.py --only backend
          synced="$(jq -r .info.version api-reference/openapi-backend.json)"
          if [[ "${synced}" != "${NEW_VERSION}" ]]; then
            echo "::error::production serves backend v${synced}, expected v${NEW_VERSION}"
            exit 1
          fi

      - name: Record version + assemble PR body
        env:
          # base64-encoded Markdown list of contributing backend PRs, built by
          # the backend side (which has the git history). Decoded here so we
          # don't have to wrestle newlines through the dispatch payload.
          PRS_B64: ${{ github.event.client_payload.contributing_prs_b64 }}
        run: |
          # The committed marker is the diff that lets create-pull-request open
          # a PR — and it records which version this repo's docs last caught up
          # to. The backend reads it as the floor for the next PR's PR list.
          mkdir -p .spec
          printf '%s\n' "${NEW_VERSION}" > .spec/backend-version

          {
            echo "The backend shipped a new **production API version**: \`${PREV_VERSION:-none}\` → \`${NEW_VERSION}\`."
            echo
            echo "This PR regenerates \`api-reference/openapi-backend.json\` from the"
            echo "production spec, so the endpoint reference updates when it merges."
            echo
            echo "> [!IMPORTANT]"
            echo "> The guide pages are hand-written and don't update automatically."
            echo "> Review the backend PRs below and edit the affected MDX **on this"
            echo "> branch** before merging."
            echo
            echo "## Contributing backend PRs"
            echo
            if [[ -n "${PRS_B64}" ]]; then
              echo "${PRS_B64}" | base64 -d
            else
              echo "_No PRs detected in range — see the backend's release history for this version._"
            fi
          } > /tmp/pr-body.md

      - name: Open per-version docs PR
        uses: peter-evans/create-pull-request@v6
        with:
          # One branch per version — a new version opens a new PR rather than
          # updating a prior, possibly-unmerged one. Re-deploys of the same
          # version update the existing PR in place.
          branch: docs-drift/v${{ env.NEW_VERSION }}
          base: main
          labels: docs-drift
          title: "docs: review API reference for backend v${{ env.NEW_VERSION }}"
          commit-message: "chore(spec): sync the API reference to backend v${{ env.NEW_VERSION }}"
          body-path: /tmp/pr-body.md
